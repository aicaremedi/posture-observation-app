<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>姿勢観察支援アプリ</title>
<style>
:root {
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --accent: #059669;
  --accent-light: #d1fae5;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --danger: #dc2626;
  --left-color: #3b82f6;
  --right-color: #ef4444;
  --center-color: #10b981;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-600: #4b5563;
  --gray-800: #1f2937;
  --gray-900: #111827;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #000;
  color: #fff;
  touch-action: manipulation;
}

/* ===== Screen management ===== */
.screen { display: none; height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ===== HOME SCREEN ===== */
#homeScreen {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
  justify-content: center;
  align-items: center;
  padding: 24px;
}
.home-logo {
  font-size: 2.2rem;
  font-weight: 800;
  margin-bottom: 8px;
  text-align: center;
}
.home-sub {
  font-size: 0.95rem;
  opacity: 0.7;
  margin-bottom: 48px;
  text-align: center;
}
.home-buttons {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 360px;
}
.home-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  border: none;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.home-btn:active { transform: scale(0.97); }
.home-btn .icon { font-size: 1.8rem; }
.home-btn.primary-btn { background: var(--primary); color: #fff; }
.home-btn.secondary-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

/* ===== TEMPLATE SELECT SCREEN ===== */
#templateScreen {
  background: var(--gray-50);
  color: var(--gray-800);
}
.screen-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  min-height: 56px;
}
.back-btn {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  padding: 4px 8px;
  color: var(--gray-800);
}
.screen-title { font-size: 1.1rem; font-weight: 700; }

.tab-bar {
  display: flex;
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
}
.tab-btn {
  flex: 1;
  padding: 12px 8px;
  border: none;
  background: none;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--gray-600);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.template-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.template-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.15s;
}
.template-card:active { transform: scale(0.98); }
.template-card .t-code {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 6px;
}
.template-card .t-code.cat-b { background: var(--accent-light); color: var(--accent); }
.template-card .t-code.cat-c { background: var(--warning-light); color: var(--warning); }
.template-card .t-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.template-card .t-desc { font-size: 0.82rem; color: var(--gray-600); }
.template-card .t-accuracy {
  display: inline-block;
  margin-top: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 8px;
}
.acc-high { background: #d1fae5; color: #065f46; }
.acc-mid { background: #fef3c7; color: #92400e; }
.acc-low { background: #fee2e2; color: #991b1b; }

/* ===== CAPTURE SCREEN ===== */
#captureScreen { background: #000; position: relative; }
.capture-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
}
.capture-header .back-btn { color: #fff; }
.capture-header .screen-title { color: #fff; font-size: 0.95rem; }
.capture-status {
  margin-left: auto;
  font-size: 0.8rem;
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
}
.capture-status.recording { background: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.video-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#cameraVideo {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#overlayCanvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.guide-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #fff;
  font-size: 1rem;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  pointer-events: none;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.3s;
}
.guide-overlay.visible { opacity: 1; }

/* Overlay controls */
.overlay-controls {
  position: absolute;
  top: 64px;
  right: 8px;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ov-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 1.1rem;
  cursor: pointer;
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.ov-btn.active { background: var(--primary); }

/* Bottom toolbar */
.capture-toolbar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 16px 24px 32px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
}
.tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 0.7rem;
}
.tool-btn .btn-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  backdrop-filter: blur(4px);
  transition: background 0.2s, transform 0.15s;
}
.tool-btn:active .btn-icon { transform: scale(0.9); }
.tool-btn.capture-main .btn-icon {
  width: 68px;
  height: 68px;
  background: #fff;
  color: #000;
  font-size: 1.8rem;
}
.tool-btn.recording .btn-icon {
  background: var(--danger);
  color: #fff;
}

/* Timer overlay for tests */
.timer-overlay {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  text-align: center;
  display: none;
}
.timer-overlay.visible { display: block; }
.timer-display {
  font-size: 3rem;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  font-variant-numeric: tabular-nums;
}
.timer-count {
  font-size: 1.4rem;
  color: #fbbf24;
  font-weight: 700;
  margin-top: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.timer-controls {
  margin-top: 12px;
  display: flex;
  gap: 12px;
  justify-content: center;
}
.timer-btn {
  padding: 8px 20px;
  border: none;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}
.timer-start { background: var(--accent); color: #fff; }
.timer-stop { background: var(--danger); color: #fff; }
.timer-reset { background: rgba(255,255,255,0.2); color: #fff; }

/* ===== RESULT SCREEN ===== */
#resultScreen {
  background: var(--gray-50);
  color: var(--gray-800);
}
.result-preview {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
  position: relative;
}
.result-preview img, .result-preview video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.result-actions {
  display: flex;
  gap: 12px;
  padding: 16px;
  background: #fff;
  border-top: 1px solid var(--gray-200);
}
.result-btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s;
}
.result-btn:active { transform: scale(0.97); }
.result-btn.save { background: var(--primary); color: #fff; }
.result-btn.retake { background: var(--gray-100); color: var(--gray-800); }

/* ===== HISTORY SCREEN ===== */
#historyScreen { background: var(--gray-50); color: var(--gray-800); }
.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.history-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.history-thumb {
  width: 72px;
  height: 72px;
  border-radius: 8px;
  background: var(--gray-100);
  object-fit: cover;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  overflow: hidden;
}
.history-thumb img { width: 100%; height: 100%; object-fit: cover; }
.history-info { flex: 1; min-width: 0; }
.history-info .h-code {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary);
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 0.75rem;
  font-weight: 700;
}
.history-info .h-date { font-size: 0.8rem; color: var(--gray-600); margin-top: 2px; }
.history-info .h-uploaded { font-size: 0.72rem; color: var(--accent); font-weight: 600; }
.history-actions-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}
.h-btn {
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
.h-btn.view { background: var(--primary-light); color: var(--primary); }
.h-btn.del { background: #fee2e2; color: var(--danger); }
.compare-check { transform: scale(1.4); accent-color: var(--primary); margin-right: 4px; }
.history-empty { text-align: center; color: var(--gray-600); padding: 48px 16px; }
.compare-bar {
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid var(--gray-200);
}
.compare-bar button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
}
.compare-bar button:disabled { background: var(--gray-200); color: var(--gray-600); }

/* ===== COMPARE SCREEN ===== */
#compareScreen { background: #000; }
.compare-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  overflow: hidden;
}
.compare-cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #111;
}
.compare-cell img, .compare-cell video { max-width: 100%; max-height: 100%; object-fit: contain; }
.compare-label {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 10px;
  z-index: 2;
}

/* ===== ANNOTATION SCREEN ===== */
#annotationScreen { background: var(--gray-50); color: var(--gray-800); }
.anno-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  overflow: hidden;
  position: relative;
  min-height: 0;
}
#annoCanvas {
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  cursor: crosshair;
}
.anno-main video { max-width: 100%; max-height: 100%; }
.anno-tools {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: #fff;
  border-top: 1px solid var(--gray-200);
  overflow-x: auto;
}
.anno-tools .tool-label { font-size: 0.8rem; color: var(--gray-600); white-space: nowrap; }
.color-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
  flex-shrink: 0;
}
.color-btn.selected { border-color: var(--gray-900); }
.anno-tool-btn {
  border: 1px solid var(--gray-200);
  background: var(--gray-100);
  color: var(--gray-800);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.anno-comment {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid var(--gray-200);
}
.anno-comment textarea {
  flex: 1;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.9rem;
  font-family: inherit;
  resize: none;
  height: 64px;
}
.anno-comment button {
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 0 22px;
  cursor: pointer;
}
.h-btn.anno { background: var(--accent-light); color: var(--accent); }
.h-comment-mark { font-size: 0.72rem; color: var(--warning); font-weight: 600; }

/* ===== SETTINGS MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: #fff;
  color: var(--gray-800);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-box h3 { font-size: 1.1rem; margin-bottom: 16px; }
.modal-field { margin-bottom: 14px; }
.modal-field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--gray-600); }
.modal-field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  font-size: 0.95rem;
}
.modal-hint { font-size: 0.75rem; color: var(--gray-600); margin-top: 4px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}
.modal-save { background: var(--primary); color: #fff; }
.modal-cancel { background: var(--gray-100); color: var(--gray-800); }

/* ===== USER SELECT ===== */
.user-list {
  max-height: 40vh;
  overflow-y: auto;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.user-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.95rem;
}
.user-item.selected {
  border-color: var(--primary);
  background: var(--primary-light);
  font-weight: 700;
}
.user-item .u-icon { font-size: 1.1rem; }
.user-add-row { display: flex; gap: 8px; margin-bottom: 4px; }
.user-add-row input {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  font-size: 0.95rem;
}
.user-add-row button {
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  padding: 0 18px;
  cursor: pointer;
}
#qrCodeBox { display: flex; justify-content: center; padding: 12px; }
#qrCodeBox img, #qrCodeBox canvas { border: 8px solid #fff; border-radius: 4px; }
.viewer-box {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  max-height: 65vh;
  overflow: hidden;
  background: #111;
  border-radius: 10px;
}
.viewer-box img, .viewer-box video { max-width: 100%; max-height: 65vh; object-fit: contain; }
.cloud-toggle {
  margin-left: auto;
  border: 1px solid var(--gray-200);
  background: var(--gray-100);
  color: var(--gray-800);
  border-radius: 16px;
  padding: 6px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
.cloud-toggle.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: rgba(17,24,39,0.92);
  color: #fff;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 0.9rem;
  z-index: 200;
  transition: transform 0.3s;
  max-width: 90vw;
  text-align: center;
}
.toast.visible { transform: translateX(-50%) translateY(0); }

/* ===== RESPONSIVE ===== */
@media (min-width: 768px) {
  .home-buttons { max-width: 400px; }
  .template-list { max-width: 600px; margin: 0 auto; }
  .history-list { max-width: 600px; margin: 0 auto; width: 100%; }
}
</style>
</head>
<body>

<!-- ===== HOME SCREEN ===== -->
<div id="homeScreen" class="screen active">
  <div class="home-logo">姿勢観察支援</div>
  <div class="home-sub">棒人間表示による姿勢観察支援ツール</div>
  <div class="home-buttons">
    <button class="home-btn secondary-btn" id="userSelectBtn" onclick="openUserModal()">
      <span class="icon">👤</span>
      <span id="userSelectLabel">利用者を選択</span>
    </button>
    <button class="home-btn primary-btn" onclick="startCaptureFlow()">
      <span class="icon">📷</span>
      <span>撮影を始める</span>
    </button>
    <button class="home-btn secondary-btn" id="loadVideoBtn">
      <span class="icon">📂</span>
      <span>動画を読み込む</span>
    </button>
    <button class="home-btn secondary-btn" onclick="openHistory()">
      <span class="icon">🗂</span>
      <span>履歴・前後比較</span>
    </button>
    <button class="home-btn secondary-btn" onclick="openSettings()">
      <span class="icon">⚙️</span>
      <span>設定</span>
    </button>
  </div>
  <input type="file" id="videoFileInput" accept="video/*" style="display:none">
</div>

<!-- ===== TEMPLATE SELECT SCREEN ===== -->
<div id="templateScreen" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="showScreen('homeScreen')">←</button>
    <div class="screen-title">テンプレート選択</div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="posture" onclick="switchTab(this)">姿勢観察</button>
    <button class="tab-btn" data-tab="motion" onclick="switchTab(this)">動作観察</button>
    <button class="tab-btn" data-tab="test" onclick="switchTab(this)">簡易検査</button>
  </div>
  <div class="template-list" id="templateList"></div>
</div>

<!-- ===== CAPTURE SCREEN ===== -->
<div id="captureScreen" class="screen">
  <div class="capture-header">
    <button class="back-btn" onclick="stopCapture()">←</button>
    <div class="screen-title" id="captureTitle">撮影</div>
    <div class="capture-status" id="captureStatus">準備中...</div>
  </div>

  <div class="video-container">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
    <div class="guide-overlay" id="guideOverlay"></div>
  </div>

// ===== SKELETON CONNECTIONS =====
// Left side (blue), Right side (red), Center (green)
const POSE_CONNECTIONS = [
  // Center
  { from: 11, to: 12, side: 'center' }, // shoulder line
  { from: 23, to: 24, side: 'center' }, // hip line
  // Left side (blue)
  { from: 11, to: 13, side: 'left' },  // L shoulder -> L elbow
  { from: 13, to: 15, side: 'left' },  // L elbow -> L wrist
  { from: 11, to: 23, side: 'left' },  // L shoulder -> L hip
  { from: 23, to: 25, side: 'left' },  // L hip -> L knee
  { from: 25, to: 27, side: 'left' },  // L knee -> L ankle

  { from: 12, to: 14, side: 'right' }, // R shoulder -> R elbow
  { from: 14, to: 16, side: 'right' }, // R elbow -> R wrist
  { from: 12, to: 24, side: 'right' }, // R shoulder -> R hip
  { from: 24, to: 26, side: 'right' }, // R hip -> R knee
  { from: 26, to: 28, side: 'right' }, // R knee -> R ankle
  // Face (simplified)
  { from: 0, to: 11, side: 'center' }, // nose -> L shoulder (approx neck)
  { from: 0, to: 12, side: 'center' }, // nose -> R shoulder
];

const SIDE_COLORS = {
  left: 'rgba(59, 130, 246, {a})',   // blue
  right: 'rgba(239, 68, 68, {a})',   // red
  center: 'rgba(16, 185, 129, {a})', // green
};

// ===== SCREEN NAVIGATION =====
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  state.currentScreen = screenId;

  if (screenId === 'templateScreen') {
    renderTemplates();
  }
}

// ===== TEMPLATE RENDERING =====
function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.currentTab = btn.dataset.tab;
  renderTemplates();
}

function renderTemplates() {
  const list = document.getElementById('templateList');
  const items = templates[state.currentTab] || [];
  const catClass = state.currentTab === 'motion' ? 'cat-b' : state.currentTab === 'test' ? 'cat-c' : '';

  list.innerHTML = items.map(t => `
    <div class="template-card" onclick="selectTemplate('${state.currentTab}', '${t.code}')">
      <span class="t-code ${catClass}">${t.code}</span>
      <div class="t-name">${t.name}</div>
      <div class="t-desc">${t.desc}</div>
      ${t.accuracy !== 'none' ? `<span class="t-accuracy acc-${t.accuracy}">${t.accuracy === 'high' ? '精度: 高' : t.accuracy === 'mid' ? '精度: 中' : '精度: 低'}</span>` : ''}
    </div>
  `).join('');
}

function selectTemplate(category, code) {
  const items = templates[category];
  const tmpl = items.find(t => t.code === code);
  if (!tmpl) return;
  state.currentTemplate = tmpl;

  // Handle manual input templates (C-8 weight)
  if (tmpl.manualInput) {
    showManualInputDialog(tmpl);
    return;
  }

  startCapture(tmpl);
}

// ===== MANUAL INPUT (C-8 etc) =====
async function showManualInputDialog(tmpl) {
  const weight = prompt('体重を入力してください（kg）:');
  if (weight === null || weight === '') return;
  const w = parseFloat(weight);
  if (isNaN(w)) { showToast('数値を入力してください'); return; }

  // 身長は利用者ごとに記憶する
  const settings = getSettings();
  const currentUser = getCurrentUser();
  const userKey = currentUser ? currentUser.name : '_default';
  const heightMap = settings.heightByUser || {};
  let heightCm = heightMap[userKey];
  if (!heightCm) {
    const height = prompt('身長を入力してください（cm、初回のみ）:');
    if (height) {
      heightCm = parseFloat(height);
      if (!isNaN(heightCm) && heightCm > 0) {
        heightMap[userKey] = heightCm;
        localStorage.setItem('postureAppSettings', JSON.stringify({ ...settings, heightByUser: heightMap }));
      }
    }
  }

  let bmi = '';
  if (heightCm > 0) {
    const h = heightCm / 100;
    bmi = (w / (h * h)).toFixed(1);
  }
  const msg = `体重: ${w}kg` + (bmi ? ` / BMI: ${bmi}` : '');

  if (settings.gasUrl) {
    showToast('Google Driveに記録中...');
    try {
      await uploadMeasurementToGas('体重', w, bmi ? `BMI:${bmi}` : '');
      showToast(`記録しました ✓ ${msg}`);
    } catch (err) {
      console.error('Measurement upload error:', err);
      showToast(`記録失敗（通信エラー）: ${msg}`);
    }
  } else {
    showToast(`記録: ${msg}（Drive連携は未設定）`);
  }
}

// ===== CAMERA & MEDIAPIPE =====
async function startCapture(tmpl) {
  showScreen('captureScreen');
  document.getElementById('captureTitle').textContent = tmpl ? `${tmpl.code} ${tmpl.name}` : '撮影';
  document.getElementById('captureStatus').textContent = '起動中...';
  document.getElementById('captureStatus').classList.remove('recording');

  // Show guide
  const guide = document.getElementById('guideOverlay');
  if (tmpl && tmpl.guide) {
    const guideText = tmpl.guide;
    guide.textContent = guideText;
    guide.classList.add('visible');
    setTimeout(() => {
      // Don't hide if the text was replaced by an error message
      if (guide.textContent === guideText) guide.classList.remove('visible');
    }, 4000);
  }

  // Setup timer
  const timerOverlay = document.getElementById('timerOverlay');
  if (tmpl && tmpl.timer && tmpl.timer !== 'none') {
    timerOverlay.classList.add('visible');
    state.timerMode = tmpl.timer;
    state.timerDuration = tmpl.timerDuration || 0;
    state.autoCount = 0;
    state.lastStandingState = null;
    state.hipYHistory = [];
    resetTimer();
    if (tmpl.autoCount) {
      document.getElementById('timerCount').textContent = '回数: 0';
    } else {
      document.getElementById('timerCount').textContent = '';
    }
  } else {
    timerOverlay.classList.remove('visible');
    state.timerMode = null;
  }

  await initCamera();
  await initPose();
}

async function initCamera() {
  // Stop existing stream
  if (state.cameraStream) {
    state.cameraStream.getTracks().forEach(t => t.stop());
  }

  const video = document.getElementById('cameraVideo');
  try {
    const constraints = {
      video: {
        facingMode: state.facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    state.cameraStream = stream;
    video.srcObject = stream;
    await video.play();

    // Set canvas size
    const canvas = document.getElementById('overlayCanvas');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    document.getElementById('captureStatus').textContent = '検出中...';
  } catch (err) {
    console.error('Camera error:', err);
    document.getElementById('captureStatus').textContent = 'カメラエラー';
    const guide = document.getElementById('guideOverlay');
    guide.textContent = 'カメラにアクセスできませんでした。ブラウザの設定でカメラの許可を確認してください。';
    guide.classList.add('visible');
  }
}

async function initPose() {
  if (state.pose) {
    // Already initialized, just start sending frames
    requestAnimationFrame(processFrame);
    return;
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1, // 0=lite, 1=full, 2=heavy
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });

  pose.onResults(onPoseResults);
  state.pose = pose;

  requestAnimationFrame(processFrame);
}

async function processFrame() {
  if (state.currentScreen !== 'captureScreen') return;

  const video = document.getElementById('cameraVideo');
  if (video.readyState >= 2 && state.pose) {
    try {
      await state.pose.send({ image: video });
    } catch (e) {
      // Ignore frame errors
    }
  }
  requestAnimationFrame(processFrame);
}

function onPoseResults(results) {
  const canvas = document.getElementById('overlayCanvas');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('cameraVideo');

  // Match canvas to video dimensions
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw camera image on canvas (for skeleton-only mode or recording)
  if (state.skeletonOnly) {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (results.poseLandmarks) {
    state.latestLandmarks = results.poseLandmarks;
    document.getElementById('captureStatus').textContent = '検出中 ✓';

    if (state.showSkeleton) {
      drawSkeleton(ctx, results.poseLandmarks, canvas.width, canvas.height);
    }
    if (state.showAngles) {
      drawAngles(ctx, results.poseLandmarks, canvas.width, canvas.height);
    }

    // Auto counting for tests
    if (state.timerRunning && state.currentTemplate && state.currentTemplate.autoCount) {
      processAutoCount(results.poseLandmarks);
    }
  } else {
    document.getElementById('captureStatus').textContent = '人物を映してください';
    state.latestLandmarks = null;
  }
}

function drawSkeleton(ctx, landmarks, w, h) {
  // Draw connections
  POSE_CONNECTIONS.forEach(conn => {
    const from = landmarks[conn.from];
    const to = landmarks[conn.to];
    if (!from || !to) return;

    const avgVis = (from.visibility + to.visibility) / 2;
    if (avgVis < 0.4) return; // Too low confidence

    const alpha = avgVis >= 0.7 ? 1.0 : 0.4;
    const lineWidth = avgVis >= 0.7 ? 4 : 2;
    const color = SIDE_COLORS[conn.side].replace('{a}', alpha);

    ctx.beginPath();
    ctx.moveTo(from.x * w, from.y * h);
    ctx.lineTo(to.x * w, to.y * h);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.stroke();
  });

  // Draw joint points
  const keyJoints = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
  keyJoints.forEach(idx => {
    const lm = landmarks[idx];
    if (!lm || lm.visibility < 0.4) return;

    const alpha = lm.visibility >= 0.7 ? 1.0 : 0.5;
    const radius = lm.visibility >= 0.7 ? 6 : 4;
    const side = [11, 13, 15, 23, 25, 27].includes(idx) ? 'left' :
                 [12, 14, 16, 24, 26, 28].includes(idx) ? 'right' : 'center';
    const color = SIDE_COLORS[side].replace('{a}', alpha);

    ctx.beginPath();
    ctx.arc(lm.x * w, lm.y * h, radius, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.8})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}

function drawAngles(ctx, landmarks, w, h) {
  // Shoulder tilt
  const ls = landmarks[11];
  const rs = landmarks[12];
  if (ls && rs && ls.visibility > 0.6 && rs.visibility > 0.6) {
    const angleDeg = Math.atan2((rs.y - ls.y) * h, (rs.x - ls.x) * w) * (180 / Math.PI);
    const midX = ((ls.x + rs.x) / 2) * w;
    const midY = ((ls.y + rs.y) / 2) * h;
    drawAngleLabel(ctx, midX, midY - 20, `肩: ${angleDeg.toFixed(1)}°`);
  }

  // Hip tilt
  const lh = landmarks[23];
  const rh = landmarks[24];
  if (lh && rh && lh.visibility > 0.6 && rh.visibility > 0.6) {
    const angleDeg = Math.atan2((rh.y - lh.y) * h, (rh.x - lh.x) * w) * (180 / Math.PI);
    const midX = ((lh.x + rh.x) / 2) * w;
    const midY = ((lh.y + rh.y) / 2) * h;
    drawAngleLabel(ctx, midX, midY - 20, `骨盤: ${angleDeg.toFixed(1)}°`);
  }

  // Trunk lateral tilt (shoulder midpoint to hip midpoint)
  if (ls && rs && lh && rh &&
      ls.visibility > 0.6 && rs.visibility > 0.6 &&
      lh.visibility > 0.6 && rh.visibility > 0.6) {
    const sMidX = (ls.x + rs.x) / 2;
    const sMidY = (ls.y + rs.y) / 2;
    const hMidX = (lh.x + rh.x) / 2;
    const hMidY = (lh.y + rh.y) / 2;
    const trunkAngle = Math.atan2((sMidX - hMidX) * w, (hMidY - sMidY) * h) * (180 / Math.PI);
    const labelX = ((sMidX + hMidX) / 2) * w + 40;
    const labelY = ((sMidY + hMidY) / 2) * h;
    drawAngleLabel(ctx, labelX, labelY, `体幹: ${trunkAngle.toFixed(1)}°`);
  }
}

function drawAngleLabel(ctx, x, y, text) {
  ctx.font = 'bold 14px sans-serif';
  const metrics = ctx.measureText(text);
  const pad = 6;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(x - pad, y - 14 - pad, metrics.width + pad * 2, 20 + pad);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(text, x, y);
}

// ===== AUTO COUNTING (5STS / CS-30) =====
function processAutoCount(landmarks) {
  const lHip = landmarks[23];
  const rHip = landmarks[24];
  if (!lHip || !rHip || lHip.visibility < 0.5 || rHip.visibility < 0.5) return;

  const hipY = (lHip.y + rHip.y) / 2;
  state.hipYHistory.push(hipY);

  // Keep last 30 frames
  if (state.hipYHistory.length > 30) state.hipYHistory.shift();
  if (state.hipYHistory.length < 10) return;

  // Calculate threshold from min/max
  const minY = Math.min(...state.hipYHistory);
  const maxY = Math.max(...state.hipYHistory);
  const range = maxY - minY;
  if (range < 0.03) return; // Not enough movement

  const threshold = (minY + maxY) / 2;
  const currentState = hipY < threshold ? 'standing' : 'sitting';

  if (state.lastStandingState === 'sitting' && currentState === 'standing') {
    state.autoCount++;
    document.getElementById('timerCount').textContent = `回数: ${state.autoCount}`;

    // For 5STS, auto-stop at 5
    if (state.currentTemplate && state.currentTemplate.targetCount &&
        state.autoCount >= state.currentTemplate.targetCount) {
      stopTimer();
    }
  }
  state.lastStandingState = currentState;
}

// ===== TIMER =====
function toggleTimer() {
  if (state.timerRunning) {
    stopTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  state.timerRunning = true;
  state.timerStart = performance.now() - state.timerElapsed;
  state.autoCount = 0;
  state.lastStandingState = null;
  state.hipYHistory = [];

  if (state.currentTemplate && state.currentTemplate.autoCount) {
    document.getElementById('timerCount').textContent = '回数: 0';
  }

  document.getElementById('timerStartBtn').textContent = '停止';
  document.getElementById('timerStartBtn').classList.remove('timer-start');
  document.getElementById('timerStartBtn').classList.add('timer-stop');

  state.timerInterval = setInterval(() => {
    state.timerElapsed = performance.now() - state.timerStart;
    updateTimerDisplay();

    // Countdown auto-stop
    if (state.timerMode === 'countdown' && state.timerDuration > 0) {
      const remaining = state.timerDuration * 1000 - state.timerElapsed;
      if (remaining <= 0) {
        stopTimer();
      }
    }
  }, 100);
}

function stopTimer() {
  state.timerRunning = false;
  clearInterval(state.timerInterval);
  document.getElementById('timerStartBtn').textContent = '開始';
  document.getElementById('timerStartBtn').classList.add('timer-start');
  document.getElementById('timerStartBtn').classList.remove('timer-stop');
}

function resetTimer() {
  stopTimer();
  state.timerElapsed = 0;
  state.autoCount = 0;
  state.lastStandingState = null;
  state.hipYHistory = [];
  updateTimerDisplay();
  if (state.currentTemplate && state.currentTemplate.autoCount) {
    document.getElementById('timerCount').textContent = '回数: 0';
  } else {
    document.getElementById('timerCount').textContent = '';
  }
}

function updateTimerDisplay() {
  const display = document.getElementById('timerDisplay');
  let ms;
  if (state.timerMode === 'countdown' && state.timerDuration > 0) {
    ms = Math.max(0, state.timerDuration * 1000 - state.timerElapsed);
  } else {
    ms = state.timerElapsed;
  }
  const totalSec = ms / 1000;
  const min = Math.floor(totalSec / 60);
  const sec = Math.floor(totalSec % 60);
  const tenth = Math.floor((totalSec * 10) % 10);
  display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${tenth}`;
}

// ===== SCREENSHOT =====
function takeScreenshot() {
  const video = document.getElementById('cameraVideo');
  const overlay = document.getElementById('overlayCanvas');

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  const ctx = canvas.getContext('2d');

  // Draw video frame
  if (!state.skeletonOnly) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw skeleton overlay
  ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

  // Add timestamp and template info
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(8, canvas.height - 36, ctx.measureText(ts).width + 20, 28);
  ctx.fillStyle = '#fff';
  ctx.fillText(ts, 18, canvas.height - 14);

  if (state.currentTemplate) {
    const label = `${state.currentTemplate.code} ${state.currentTemplate.name}`;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(8, 8, ctx.measureText(label).width + 20, 28);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, 18, 28);
  }

  canvas.toBlob(blob => {
    state.lastResultBlob = blob;
    state.lastResultType = 'image';
    showResult();
  }, 'image/png');
}

// ===== RECORDING =====
function toggleRecording() {
  if (state.isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  const video = document.getElementById('cameraVideo');
  const overlay = document.getElementById('overlayCanvas');

  // Create composite canvas for recording
  const recCanvas = document.createElement('canvas');
  recCanvas.width = video.videoWidth || 1280;
  recCanvas.height = video.videoHeight || 720;
  const recCtx = recCanvas.getContext('2d');

  // Composite loop
  const drawComposite = () => {
    if (!state.isRecording) return;
    if (!state.skeletonOnly) {
      recCtx.drawImage(video, 0, 0, recCanvas.width, recCanvas.height);
    } else {
      recCtx.fillStyle = '#111827';
      recCtx.fillRect(0, 0, recCanvas.width, recCanvas.height);
    }
    recCtx.drawImage(overlay, 0, 0, recCanvas.width, recCanvas.height);
    requestAnimationFrame(drawComposite);
  };

  const stream = recCanvas.captureStream(30);
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' :
                   MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';

  state.mediaRecorder = new MediaRecorder(stream, { mimeType });
  state.recordedChunks = [];

  state.mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) state.recordedChunks.push(e.data);
  };

  state.mediaRecorder.onstop = () => {
    const blob = new Blob(state.recordedChunks, { type: mimeType });
    state.lastResultBlob = blob;
    state.lastResultType = 'video';
    showResult();
  };

  state.mediaRecorder.start(100);
  state.isRecording = true;
  drawComposite();

  document.getElementById('recordBtn').classList.add('recording');
  document.getElementById('captureStatus').textContent = '録画中';
  document.getElementById('captureStatus').classList.add('recording');
}

function stopRecording() {
  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
  state.isRecording = false;
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('captureStatus').textContent = '検出中 ✓';
  document.getElementById('captureStatus').classList.remove('recording');
}

// ===== RESULT =====
function showResult() {
  showScreen('resultScreen');
  const preview = document.getElementById('resultPreview');
  preview.innerHTML = '';

  if (state.lastResultType === 'image') {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(state.lastResultBlob);
    preview.appendChild(img);
  } else if (state.lastResultType === 'video') {
    const vid = document.createElement('video');
    vid.src = URL.createObjectURL(state.lastResultBlob);
    vid.controls = true;
    vid.autoplay = true;
    vid.loop = true;
    vid.playsInline = true;
    preview.appendChild(vid);
  }
}

function buildTimestampName(now) {
  return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
}

function currentSkeletonJson(now) {
  if (!state.latestLandmarks) return null;
  return {
    template: state.currentTemplate ? state.currentTemplate.code : null,
    timestamp: now.toISOString(),
    landmarks: state.latestLandmarks.map(lm => ({
      x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility
    }))
  };
}

// 端末へのダウンロード（従来の保存動作）
function downloadResult() {
  if (!state.lastResultBlob) return;

  const ext = state.lastResultType === 'image' ? 'png' : 'webm';
  const now = new Date();
  const ts = buildTimestampName(now);
  const tmplName = state.currentTemplate ? `_${state.currentTemplate.code}` : '';
  const filename = `姿勢観察${tmplName}_${ts}.${ext}`;

  const a = document.createElement('a');
  a.href = URL.createObjectURL(state.lastResultBlob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);

  if (state.latestLandmarks && state.lastResultType === 'image') {
    const jsonData = currentSkeletonJson(now);
    const jsonBlob = new Blob([JSON.stringify(jsonData, null, 2)], { type: 'application/json' });
    const jsonA = document.createElement('a');
    jsonA.href = URL.createObjectURL(jsonBlob);
    jsonA.download = `姿勢観察${tmplName}_${ts}_skeleton.json`;
    jsonA.click();
    URL.revokeObjectURL(jsonA.href);
  }

  showToast('端末にダウンロードしました');
}

// 保存（履歴に記録 + Google Drive自動アップロード）
async function saveResult() {
  if (!state.lastResultBlob) return;

  const now = new Date();
  const currentUser = getCurrentUser();
  const record = {
    user: currentUser ? currentUser.name : null,
    template: state.currentTemplate ? state.currentTemplate.code : null,
    templateName: state.currentTemplate ? state.currentTemplate.name : '',
    type: state.lastResultType,
    blob: state.lastResultBlob,
    skeleton: (state.lastResultType === 'image') ? currentSkeletonJson(now) : null,
    timestamp: now.toISOString(),
    uploaded: false,
  };

  try {
    const id = await dbAdd(record);
    let msg = '履歴に保存しました';

    const settings = getSettings();
    if (settings.gasUrl) {
      showToast('Google Driveにアップロード中...');
      try {
        await uploadRecordToGas(record);
        record.id = id;
        record.uploaded = true;
        await dbPut(record);
        msg = 'Google Driveに保存しました ✓';
      } catch (err) {
        console.error('Upload error:', err);
        msg = '履歴に保存（Drive送信は失敗。後で再送できます）';
      }
    }
    showToast(msg);
    showScreen('captureScreen');
  } catch (err) {
    console.error('Save error:', err);
    showToast('保存に失敗しました');
  }
}

// ===== GAS通信ヘルパー =====
async function gasCall(payload) {
  const settings = getSettings();
  if (!settings.gasUrl) throw new Error('GAS URL not configured');
  const res = await fetch(settings.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  const result = await res.json();
  if (result.status !== 'ok') throw new Error(result.message || 'GAS error');
  return result;
}

// ===== 利用者管理 =====
function getLocalUsers() {
  try {
    return JSON.parse(localStorage.getItem('postureAppUsers') || '[]');
  } catch (e) { return []; }
}

function saveLocalUsers(users) {
  localStorage.setItem('postureAppUsers', JSON.stringify(users));
}

function getCurrentUser() {
  const name = localStorage.getItem('postureAppCurrentUser');
  if (!name) return null;
  return getLocalUsers().find(u => u.name === name) || { name, token: '' };
}

function setCurrentUser(name) {
  localStorage.setItem('postureAppCurrentUser', name);
  updateUserLabel();
}

function updateUserLabel() {
  const user = getCurrentUser();
  document.getElementById('userSelectLabel').textContent =
    user ? `利用者: ${user.name}` : '利用者を選択';
}

async function openUserModal() {
  renderUserList();
  document.getElementById('userModal').classList.add('visible');

  // 施設の保存先と同期（設定済みの場合）
  const settings = getSettings();
  if (settings.gasUrl) {
    try {
      const result = await gasCall({ action: 'listUsers' });
      const local = getLocalUsers();
      const merged = [...local];
      result.users.forEach(remote => {
        const existing = merged.find(u => u.name === remote.name);
        if (existing) { existing.token = remote.token; }
        else { merged.push(remote); }
      });
      saveLocalUsers(merged);
      renderUserList();
    } catch (err) {
      console.error('User sync error:', err);
    }
  }
}

function closeUserModal() {
  document.getElementById('userModal').classList.remove('visible');
}

function renderUserList() {
  const box = document.getElementById('userListBox');
  const users = getLocalUsers();
  const current = getCurrentUser();

  if (users.length === 0) {
    box.innerHTML = '<div class="modal-hint" style="text-align:center;padding:16px;">利用者が未登録です。下の欄から追加してください。</div>';
    return;
  }

  box.innerHTML = '';
  users.forEach(u => {
    const item = document.createElement('div');
    item.className = 'user-item' + (current && current.name === u.name ? ' selected' : '');
    item.innerHTML = `<span class="u-icon">👤</span><span>${u.name}</span>`;
    item.onclick = () => {
      setCurrentUser(u.name);
      renderUserList();
    };
    box.appendChild(item);
  });
}

async function addUserFromModal() {
  const input = document.getElementById('newUserName');
  const name = input.value.trim();
  if (!name) { showToast('利用者名を入力してください'); return; }

  const users = getLocalUsers();
  if (!users.find(u => u.name === name)) {
    users.push({ name, token: '' });
    saveLocalUsers(users);
  }
  setCurrentUser(name);
  input.value = '';
  renderUserList();

  // 施設の保存先にも登録（トークン取得）
  const settings = getSettings();
  if (settings.gasUrl) {
    try {
      const result = await gasCall({ action: 'addUser', name });
      const updated = getLocalUsers();
      const u = updated.find(x => x.name === name);
      if (u) { u.token = result.user.token; saveLocalUsers(updated); }
      showToast(`${name} さんを登録しました ✓`);
    } catch (err) {
      console.error('Add user error:', err);
      showToast(`${name} さんを端末に登録（Drive同期は失敗）`);
    }
  } else {
    showToast(`${name} さんを登録しました`);
  }
}

  if (!getCurrentUser()) {
    showToast('先に利用者を選択してください');
    openUserModal();
    return;
  }
  showScreen('templateScreen');
}

    list.innerHTML = '<div class="history-empty">先にホーム画面で利用者を選択してください。</div>';
    return;
  }

  list.innerHTML = '<div class="history-empty">☁ 読み込み中...</div>';
  let records;
  try {
    const result = await gasCall({ action: 'listRecords', user: user.name });
    records = result.records;
  } catch (err) {
    console.error('Cloud history error:', err);
    list.innerHTML = '<div class="history-empty">クラウドに接続できませんでした。通信環境と設定を確認してください。</div>';
    return;
  }

  if (records.length === 0) {
    list.innerHTML = `<div class="history-empty">${user.name} さんのクラウド記録はまだありません。</div>`;
    return;
  }

  list.innerHTML = '';
  records.forEach(rec => {
    const card = document.createElement('div');
    card.className = 'history-card';

    const thumb = document.createElement('div');
    thumb.className = 'history-thumb';
    thumb.textContent = rec.mimeType.startsWith('image/') ? '🖼' :
                        rec.mimeType.startsWith('video/') ? '🎬' : '📄';

    const info = document.createElement('div');
    info.className = 'history-info';
    const d = new Date(rec.date);
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    info.innerHTML = `
      <span class="h-code">${rec.category}</span>
      <div class="h-date">${dateStr}</div>
      <div class="h-date" style="font-size:0.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${rec.name}</div>
    `;

    const actions = document.createElement('div');
    actions.className = 'history-actions-col';
    const viewBtn = document.createElement('button');
    viewBtn.className = 'h-btn view';
    viewBtn.textContent = '表示';
    viewBtn.onclick = () => viewCloudFile(rec);
    actions.appendChild(viewBtn);

    card.appendChild(thumb);
    card.appendChild(info);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

async function viewCloudFile(rec) {
  showToast('読み込み中...');
  try {
    const result = await gasCall({ action: 'getFileData', fileId: rec.id });
    const byteChars = atob(result.base64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: result.mimeType });
    const url = URL.createObjectURL(blob);

    const box = document.getElementById('viewerBox');
    box.innerHTML = '';
    if (result.mimeType.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = url;
      box.appendChild(img);
    } else if (result.mimeType.startsWith('video/')) {
      const vid = document.createElement('video');
      vid.src = url;
      vid.controls = true;
      vid.autoplay = true;
      vid.loop = true;
      vid.playsInline = true;
      box.appendChild(vid);
    } else {
      box.innerHTML = '<div style="color:#fff;padding:24px;">このファイルは表示できません</div>';
    }
    document.getElementById('viewerTitle').textContent = rec.name;
    document.getElementById('viewerModal').classList.add('visible');
  } catch (err) {
    console.error('View cloud file error:', err);
    showToast('読み込みに失敗しました。Driveで直接ご確認ください。');
  }
}

function closeViewer() {
  const vid = document.getElementById('viewerBox').querySelector('video');
  if (vid) vid.pause();
  document.getElementById('viewerModal').classList.remove('visible');
}

// ===== IndexedDB =====
let dbInstance = null;
function openDB() {
  if (dbInstance) return Promise.resolve(dbInstance);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('postureApp', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('records')) {
        const store = db.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
        store.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => { dbInstance = req.result; resolve(dbInstance); };
    req.onerror = () => reject(req.error);
  });
}

async function dbAdd(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    const req = tx.objectStore('records').add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    const req = tx.objectStore('records').put(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readonly');
    const req = tx.objectStore('records').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    const req = tx.objectStore('records').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ===== GAS UPLOAD =====
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function uploadRecordToGas(record) {
  const settings = getSettings();
  if (!settings.gasUrl) throw new Error('GAS URL not configured');

  const dataBase64 = await blobToBase64(record.blob);
  const ext = record.type === 'image' ? 'png' : 'webm';
  const ts = record.timestamp.replace(/[:.]/g, '-');
  const payload = {
    action: 'saveFile',
    user: record.user || '未設定',
    template: record.template || 'V',
    templateName: record.templateName || '',
    type: record.type,
    filename: `${ts}_${record.template || 'V'}.${ext}`,
    mimeType: record.type === 'image' ? 'image/png' : 'video/webm',
    dataBase64,
    skeleton: record.skeleton,
    timestamp: record.timestamp,
  };

  // text/plainにするとCORSプリフライトを回避できる（GAS Webアプリの定番パターン）
  const res = await fetch(settings.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  const result = await res.json();
  if (result.status !== 'ok') throw new Error(result.message || 'GAS error');
  return result;
}

async function uploadMeasurementToGas(item, value, extra) {
  const settings = getSettings();
  if (!settings.gasUrl) return false;
  const currentUser = getCurrentUser();
  const payload = {
    action: 'saveMeasurement',
    user: currentUser ? currentUser.name : '未設定',
    item, value, extra: extra || '',
    timestamp: new Date().toISOString(),
  };
  const res = await fetch(settings.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  const result = await res.json();
  return result.status === 'ok';
}

// ===== HISTORY =====
const compareSelection = new Set();

async function openHistory() {
  showScreen('historyScreen');
  compareSelection.clear();
  updateCompareBtn();
  state.cloudMode = false;
  document.getElementById('cloudToggleBtn').classList.remove('active');
  await renderHistory();
}

async function renderHistory() {
  const list = document.getElementById('historyList');
  let records = [];
  try {
    records = await dbGetAll();
  } catch (e) {
    console.error('DB error:', e);
  }

  // 利用者を選択中は、その利用者の記録＋利用者未設定の古い記録のみ表示
  const currentUser = getCurrentUser();
  if (currentUser) {
    records = records.filter(r => !r.user || r.user === currentUser.name);
  }
  records.sort((a, b) => b.timestamp.localeCompare(a.timestamp));

  if (records.length === 0) {
    list.innerHTML = '<div class="history-empty">まだ記録がありません。<br>撮影して「保存」すると、ここに履歴が残ります。</div>';
    return;
  }

  list.innerHTML = '';
  records.forEach(rec => {
    const card = document.createElement('div');
    card.className = 'history-card';

    const thumb = document.createElement('div');
    thumb.className = 'history-thumb';
    if (rec.type === 'image' && rec.blob) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(rec.blob);
      thumb.appendChild(img);
    } else {
      thumb.textContent = '🎬';
    }

    const info = document.createElement('div');
    info.className = 'history-info';
    const d = new Date(rec.timestamp);
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const hasAnno = rec.annotation && (rec.annotation.comment || (rec.annotation.strokes && rec.annotation.strokes.length > 0));
    info.innerHTML = `
      <span class="h-code">${rec.template || '─'}</span> ${rec.templateName || ''}
      <div class="h-date">${dateStr}</div>
      ${rec.uploaded ? '<div class="h-uploaded">☁ Drive保存済み</div>' : ''}
      ${hasAnno ? '<div class="h-comment-mark">💬 助言あり</div>' : ''}
    `;

    const actions = document.createElement('div');
    actions.className = 'history-actions-col';

    const checkLabel = document.createElement('label');
    checkLabel.style.cssText = 'font-size:0.75rem;display:flex;align-items:center;cursor:pointer;';
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'compare-check';
    check.checked = compareSelection.has(rec.id);
    check.onchange = () => {
      if (check.checked) {
        if (compareSelection.size >= 2) {
          check.checked = false;
          showToast('比較できるのは2件までです');
          return;
        }
        compareSelection.add(rec.id);
      } else {
        compareSelection.delete(rec.id);
      }
      updateCompareBtn();
    };
    checkLabel.appendChild(check);
    checkLabel.appendChild(document.createTextNode('比較'));

    const annoBtn = document.createElement('button');
    annoBtn.className = 'h-btn anno';
    annoBtn.textContent = '表示・助言';
    annoBtn.onclick = () => openAnnotation(rec.id);

    const delBtn = document.createElement('button');
    delBtn.className = 'h-btn del';
    delBtn.textContent = '削除';
    delBtn.onclick = async () => {
      if (confirm('この記録を削除しますか？')) {
        await dbDelete(rec.id);
        compareSelection.delete(rec.id);
        updateCompareBtn();
        renderHistory();
      }
    };

    actions.appendChild(checkLabel);
    actions.appendChild(annoBtn);
    actions.appendChild(delBtn);

    card.appendChild(thumb);
    card.appendChild(info);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

function updateCompareBtn() {
  const btn = document.getElementById('compareBtn');
  btn.disabled = compareSelection.size !== 2;
  btn.textContent = compareSelection.size === 2 ? 'この2件を比較する' : `2件選んで比較する（${compareSelection.size}/2）`;
}

async function openCompare() {
  if (compareSelection.size !== 2) return;
  const records = await dbGetAll();
  const selected = records.filter(r => compareSelection.has(r.id));
  selected.sort((a, b) => a.timestamp.localeCompare(b.timestamp));

  const grid = document.getElementById('compareGrid');
  grid.innerHTML = '';
  selected.forEach(rec => {
    const cell = document.createElement('div');
    cell.className = 'compare-cell';

    const label = document.createElement('div');
    label.className = 'compare-label';
    const d = new Date(rec.timestamp);
    label.textContent = `${rec.template || ''} ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    cell.appendChild(label);

    if (rec.type === 'image') {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(rec.blob);
      cell.appendChild(img);
    } else {
      const vid = document.createElement('video');
      vid.src = URL.createObjectURL(rec.blob);
      vid.controls = true;
      vid.loop = true;
      vid.muted = true;
      vid.playsInline = true;
      vid.autoplay = true;
      cell.appendChild(vid);
    }
    grid.appendChild(cell);
  });

  showScreen('compareScreen');
}

// ===== ANNOTATION (セラピスト助言) =====
let annoRecord = null;
let annoStrokes = [];
let annoImg = null;
let annoColor = '#ef4444';
let annoCurrentStroke = null;

async function openAnnotation(id) {
  const records = await dbGetAll();
  annoRecord = records.find(r => r.id === id);
  if (!annoRecord) return;

  annoStrokes = (annoRecord.annotation && annoRecord.annotation.strokes) ? JSON.parse(JSON.stringify(annoRecord.annotation.strokes)) : [];
  document.getElementById('annoComment').value = (annoRecord.annotation && annoRecord.annotation.comment) || '';

  const d = new Date(annoRecord.timestamp);
  document.getElementById('annoTitle').textContent =
    `${annoRecord.template || ''} ${annoRecord.templateName || ''} ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;

  const main = document.getElementById('annoMain');
  const canvas = document.getElementById('annoCanvas');
  const existingVideo = main.querySelector('video');
  if (existingVideo) existingVideo.remove();

  if (annoRecord.type === 'image') {
    canvas.style.display = '';
    document.getElementById('annoTools').style.display = '';
    annoImg = new Image();
    annoImg.onload = () => {
      canvas.width = annoImg.naturalWidth;
      canvas.height = annoImg.naturalHeight;
      redrawAnnotation();
    };
    annoImg.src = URL.createObjectURL(annoRecord.blob);
  } else {
    // 動画はコメントのみ（描画不可）
    canvas.style.display = 'none';
    document.getElementById('annoTools').style.display = 'none';
    const vid = document.createElement('video');
    vid.src = URL.createObjectURL(annoRecord.blob);
    vid.controls = true;
    vid.loop = true;
    vid.muted = true;
    vid.playsInline = true;
    vid.autoplay = true;
    main.appendChild(vid);
  }

  showScreen('annotationScreen');
}

function closeAnnotation() {
  const vid = document.getElementById('annoMain').querySelector('video');
  if (vid) { vid.pause(); vid.remove(); }
  annoRecord = null;
  openHistory();
}

function redrawAnnotation() {
  const canvas = document.getElementById('annoCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (annoImg) ctx.drawImage(annoImg, 0, 0, canvas.width, canvas.height);

  const drawStroke = (stroke) => {
    if (stroke.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(stroke.points[0].x * canvas.width, stroke.points[0].y * canvas.height);
    for (let i = 1; i < stroke.points.length; i++) {
      ctx.lineTo(stroke.points[i].x * canvas.width, stroke.points[i].y * canvas.height);
    }
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = Math.max(3, canvas.width / 250);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  };
  annoStrokes.forEach(drawStroke);
  if (annoCurrentStroke) drawStroke(annoCurrentStroke);
}

function annoPointFromEvent(e) {
  const canvas = document.getElementById('annoCanvas');
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width,
    y: (e.clientY - rect.top) / rect.height,
  };
}

function setupAnnoCanvasEvents() {
  const canvas = document.getElementById('annoCanvas');
  canvas.addEventListener('pointerdown', (e) => {
    if (!annoRecord || annoRecord.type !== 'image') return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    annoCurrentStroke = { color: annoColor, points: [annoPointFromEvent(e)] };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!annoCurrentStroke) return;
    e.preventDefault();
    annoCurrentStroke.points.push(annoPointFromEvent(e));
    redrawAnnotation();
  });
  const finish = (e) => {
    if (!annoCurrentStroke) return;
    if (annoCurrentStroke.points.length >= 2) annoStrokes.push(annoCurrentStroke);
    annoCurrentStroke = null;
    redrawAnnotation();
  };
  canvas.addEventListener('pointerup', finish);
  canvas.addEventListener('pointercancel', finish);
}

function selectAnnoColor(btn) {
  annoColor = btn.dataset.color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function undoAnnoStroke() {
  annoStrokes.pop();
  redrawAnnotation();
}

function clearAnnoStrokes() {
  annoStrokes = [];
  redrawAnnotation();
}

async function saveAnnotation() {
  if (!annoRecord) return;
  const comment = document.getElementById('annoComment').value.trim();
  annoRecord.annotation = {
    strokes: annoStrokes,
    comment,
    updatedAt: new Date().toISOString(),
  };
  try {
    await dbPut(annoRecord);
    let msg = '助言を保存しました';

    const settings = getSettings();
    if (settings.gasUrl && (comment || annoStrokes.length > 0)) {
      showToast('Google Driveに送信中...');
      try {
        await uploadAnnotationToGas(annoRecord);
        msg = '助言をGoogle Driveに保存しました ✓';
      } catch (err) {
        console.error('Annotation upload error:', err);
        msg = '助言を保存（Drive送信は失敗）';
      }
    }
    showToast(msg);
    closeAnnotation();
  } catch (err) {
    console.error('Annotation save error:', err);
    showToast('保存に失敗しました');
  }
}

async function uploadAnnotationToGas(record) {
  const settings = getSettings();
  if (!settings.gasUrl) throw new Error('GAS URL not configured');

  // マーカー描画済みの合成画像を生成（画像記録の場合のみ）
  let dataBase64 = null;
  if (record.type === 'image' && annoImg) {
    redrawAnnotation();
    const canvas = document.getElementById('annoCanvas');
    dataBase64 = canvas.toDataURL('image/png').split(',')[1];
  }

  const ts = record.timestamp.replace(/[:.]/g, '-');
  const payload = {
    action: 'saveAnnotation',
    user: record.user || (getCurrentUser() ? getCurrentUser().name : '未設定'),
    template: record.template || '',
    comment: record.annotation.comment,
    filename: `${ts}_${record.template || ''}_助言.png`,
    dataBase64,
    timestamp: new Date().toISOString(),
    recordTimestamp: record.timestamp,
  };

  const res = await fetch(settings.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  const result = await res.json();
  if (result.status !== 'ok') throw new Error(result.message || 'GAS error');
  return result;
}
